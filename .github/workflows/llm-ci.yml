name: LLM CI - Prompt Testing & Evaluation

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "prompts/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "prompts/**"
      - "tests/**"

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ── Lint and type-check ──────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy

      - name: Run ruff linter
        run: ruff check src/ --output-format=github

      - name: Run type checking
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

  # ── Unit tests ───────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short \
            -k "not integration and not e2e" \
            --junitxml=reports/unit-tests.xml
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit-tests.xml

  # ── Prompt evaluation ────────────────────────────────────
  prompt-eval:
    name: Prompt Evaluation
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run prompt versioning checks
        run: |
          python -c "
          from src.versioning.prompt_store import PromptStore
          store = PromptStore()
          # Verify prompt store initializes correctly
          print('Prompt store initialized successfully')
          print('Database tables created')
          "

      - name: Run evaluation pipeline (offline mode)
        run: |
          python -c "
          import asyncio
          from src.evaluation.eval_pipeline import EvalPipeline, TestCase

          async def run():
              pipeline = EvalPipeline()  # no API key = offline mode
              cases = [
                  TestCase(input_text='Summarize: AI is transforming healthcare.',
                           expected_output='AI transforms healthcare.'),
                  TestCase(input_text='Explain: Machine learning basics.',
                           expected_output='Machine learning is a subset of AI.'),
              ]
              report = await pipeline.run_evaluation(
                  prompt_name='ci-test',
                  test_cases=cases,
                  metrics=['accuracy', 'relevance', 'toxicity'],
              )
              print(EvalPipeline.generate_report(report))
              assert report.total_cases == 2, f'Expected 2 cases, got {report.total_cases}'
              print('Evaluation pipeline: ALL CHECKS PASSED')

          asyncio.run(run())
          "

      - name: Run canary deployment simulation
        run: |
          python -c "
          from src.deployment.canary import CanaryManager

          manager = CanaryManager()
          dep = manager.create_deployment(
              name='ci-test-canary',
              baseline_model='gpt-4o-mini',
              canary_model='gpt-4o',
              canary_weight=0.1,
          )
          # Simulate traffic
          for i in range(60):
              model = manager.route_request('ci-test-canary')
              manager.record_outcome('ci-test-canary', model, success=True, latency_ms=200 + i)
          health = manager.check_health('ci-test-canary')
          print(f'Canary health: {health}')
          assert health['healthy'], 'Canary should be healthy'
          print('Canary deployment simulation: PASSED')
          "

      - name: Run cost tracker validation
        run: |
          python -c "
          from src.tracking.cost_tracker import CostTracker

          tracker = CostTracker()
          tracker.record('gpt-4o-mini', 500, 150, endpoint='/summarize')
          tracker.record('gpt-4o', 1000, 300, endpoint='/analyze')
          report = tracker.get_report('all')
          print(CostTracker.format_report(report))
          assert report.total_requests == 2
          assert report.total_cost_usd > 0
          print('Cost tracker: PASSED')
          "

  # ── Docker build verification ────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: llmops-app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Summary gate ─────────────────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, prompt-eval, docker-build]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "Lint:        ${{ needs.lint.result }}"
          echo "Unit Tests:  ${{ needs.unit-tests.result }}"
          echo "Prompt Eval: ${{ needs.prompt-eval.result }}"
          echo "Docker:      ${{ needs.docker-build.result }}"

          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.prompt-eval.result }}" == "failure" ]] || \
             [[ "${{ needs.docker-build.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed"
